name: Publish compiled Linux release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish Debian packages
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/rybernt-backup_amd64.deb
            dist/rybernt-backup_*_amd64.deb
            dist/SHA256SUMS
