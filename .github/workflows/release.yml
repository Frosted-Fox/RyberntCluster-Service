name: Publish compiled Linux release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish Debian packages
        uses: softprops/action-gh-release@v2
        with:
          name: Rybernt Cluster ${{ github.ref_name }}
          generate_release_notes: false
          body: |
            ## Rybernt Cluster ${{ github.ref_name }}

            - Complete setup in containers without systemd, with a clear notice that scheduled backups remain inactive.
            - Make the downloaded Debian package accessible to apt's sandbox user.
            - Include the Debian package and SHA-256 checksums.

            ## Contributor

            - Ariyan Kumar
          files: |
            dist/rybernt-backup_amd64.deb
            dist/rybernt-backup_*_amd64.deb
            dist/SHA256SUMS
